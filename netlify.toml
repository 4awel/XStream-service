# Next.js на Netlify: адаптер (OpenNext) Netlify подключает сам, плагин не нужен.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # NEXT_PUBLIC_* вшиваются в бандл при сборке: поменяли — пересоберите.
  # API ходит через прокси ниже: cookie сессии становится first-party
  # (иначе Safari и режимы без сторонних cookie ломают вход).
  NEXT_PUBLIC_API_URL = "/api"
  # Netlify не проксирует WebSocket — сокет идёт на Render напрямую.
  NEXT_PUBLIC_WS_URL = "https://xstream-api.onrender.com"
  # Медиасервера нет: плеер просто не найдёт поток.
  NEXT_PUBLIC_MEDIA_HLS_URL = "https://media.invalid"
  NEXT_PUBLIC_MEDIA_WEBRTC_URL = "https://media.invalid/webrtc"

# Адрес сервиса Render. Переменные окружения в редиректах не работают,
# поэтому, если Render выдал другой адрес, поменяйте его здесь и в NEXT_PUBLIC_WS_URL.
[[redirects]]
  from = "/api/*"
  to = "https://xstream-api.onrender.com/:splat"
  status = 200
  force = true
